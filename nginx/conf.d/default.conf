server {
    # Puerto alto: un usuario sin privilegios no puede abrir el 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad ---
    # La app es 100% estatica y no hace peticiones a terceros: puede permitirse
    # una CSP restrictiva. 'unsafe-inline' en style-src es necesario porque
    # framer-motion escribe estilos en linea al animar.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html NUNCA se cachea: si no, tras un despliegue el navegador sigue
    # pidiendo bundles que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA: cualquier ruta desconocida la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
